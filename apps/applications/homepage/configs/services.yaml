# TrueNAS
- TrueNAS:
  - mobius:
      icon: truenas-scale.svg
      href: https://mobius.drak3.io
      widgets:
        - type: truenas
          url: http://192.168.11.2
          version: 2
          key: {{HOMEPAGE_VAR_TRUENAS_APIKEY}}
          enablePools: true
          nasType: scale
        # - type: uptimekuma
        #   url: http://192.168.12.4:3001
        #   slug: host-mobius
  - iDRAC:
      icon: idrac.svg
      href: https://idrac.mobius.drak3.io

# Proxmox
- Proxmox:
  - Tesseract:
      icon: proxmox.svg
      href: https://tesseract.drak3.io
      widget:
        type: proxmox
        url: https://192.168.11.3:8006
        username: api_user@pam!homepage
        password: {{HOMEPAGE_VAR_PROXMOX_TOKEN}}

# 3D printer
- Hu3bert:
  - Mainsail:
      icon:   mainsail.svg
      href:   https://mainsail.drak3.io/
      widget:
        type: moonraker
        url: http://192.168.11.10
  - Mainsail (live view):
      icon:   mainsail.svg
      href:   https://mainsail.drak3.io/webcam2/?action=stream


# media
- Media:
  # jellyfin
  - Jellyfin:
      icon: jellyfin.svg
      href: https://jellyfin.drak3.io
      namespace:  media
      app:  jellyfin
      widget:
        type: jellyfin
        url: http://192.168.13.28:8096
        key: {{HOMEPAGE_VAR_JELLYFIN_APIKEY}}
        version: 2 # optional, default is 1
        enableBlocks: true # optional, defaults to false
        enableNowPlaying: true # optional, defaults to true
        enableUser: true # optional, defaults to false
        enableMediaControl: false # optional, defaults to true
        showEpisodeNumber: true # optional, defaults to false
        expandOneStreamToTwoRows: false # optional, defaults to true
  # navidrome
  - Navidrome:
      icon: navidrome.svg
      href: https://navidrome.drak3.io
      namespace:  media
      app:  navidrome
      widget:
        type: navidrome
        url: http://192.168.13.41:4533
        user: {{HOMEPAGE_VAR_NAVIDROME_USER}}
        token: {{HOMEPAGE_VAR_NAVIDROME_TOKEN}}
        salt: {{HOMEPAGE_VAR_NAVIDROME_SALT}}
  # youtube
  - YouTube:
      icon: youtube.svg
      href: https://www.youtube.com/feed/subscriptions

