- Monitoring:
  # uptime kuma
  - Uptime-Kuma:
      icon: uptime-kuma.svg
      href: https://uptime.drak3.io
      proxmoxNode:  tesseract
      proxmoxVMID:  101
      proxmoxType:  qemu
      widget:
        type: uptimekuma
        url: http://192.168.12.4:3001
        slug: apps

  # Grafana
  - Grafana:
      icon: grafana.svg
      href: https://grafana.drak3.io
      namespace:  monitoring
      app:  grafana
      widget:
        type: grafana
        version: 2 # optional, default is 1
        alerts: alertmanager # optional, default is grafana
        url: http://192.168.13.237
        username: {{HOMEPAGE_VAR_GRAFANA_USERNAME}}
        password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}

