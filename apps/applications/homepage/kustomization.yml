---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace:  applications

resources:
  - cluster-role.yml
  # - configmap.yml
  - deployment.yml
  - service-account-secret.yml
  - service-account.yml
  - service.yml
  - sealed-secret.yml


configMapGenerator:
- name: homepage-configmap
  files:
  - configs/bookmarks.yaml
  - configs/custom.css
  - configs/custom.js
  - configs/docker.yaml
  - configs/kubernetes.yaml
  - configs/proxmox.yaml
  - configs/services.yaml
  - configs/settings.yaml
  - configs/widgets.yaml