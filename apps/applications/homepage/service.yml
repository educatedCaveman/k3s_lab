apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: applications
  labels:
    app.kubernetes.io/name: homepage
    app:  homepage
  annotations:
    metallb.universe.tf/allow-shared-ip: "homepage-metallb-ip"  
spec:
  ipFamilyPolicy: SingleStack
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
  loadBalancerIP: 192.168.13.40