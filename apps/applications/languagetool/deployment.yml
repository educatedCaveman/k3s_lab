---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: languagetool
  namespace:  applications
  labels:
    app: languagetool
spec:
  selector:
    matchLabels:
      app: languagetool
  strategy:
    type: RollingUpdate
  replicas: 1
  template:
    metadata:
      labels:
        app: languagetool
    spec:
      topologySpreadConstraints:
        - maxSkew:  1
          topologyKey:  kubernetes.io/hostname
          whenUnsatisfiable:  ScheduleAnyway
          labelSelector:
            matchLabels:
              app: languagetool
      restartPolicy: Always
      containers:
        - name: languagetool
          image: meyay/languagetool:latest@sha256:0b4a849aa00ccb2d157e40cc3bc2a4db56529ce4a20b923452148d5f84a3dd8d
          resources:
            limits:
              cpu: 10
              memory: 6Gi
            requests:
              cpu: 100m
              memory: 50Mi
          env:
          - name: download_ngrams_for_langs
            value:  "en,de"
          - name: TZ
            value:  "America/New_York"
          ports:
            # - containerPort: 8010
            - containerPort: 8081
              name: languagetool
              protocol: TCP
          volumeMounts:
          - name: languagetool-ngrams
            mountPath:  /ngrams
          - name: languagetool-fasttext
            mountPath:  /fasttext
      volumes:
        - name: languagetool-ngrams
          persistentVolumeClaim:
            claimName:  languagetool-ngram-pvc
        - name: languagetool-fasttext
          persistentVolumeClaim:
            claimName:  languagetool-fasttext-pvc
