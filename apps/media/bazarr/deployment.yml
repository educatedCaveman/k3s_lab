---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
  labels:
    app: bazarr
spec:
  selector:
    matchLabels:
      app: bazarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      restartPolicy: Always
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:1.5.6@sha256:047222423d6d8556a88581b189175bec57f286f120b52ba29c0390fe6babaa5a
          resources:
            limits:
              cpu: 4
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 50Mi
          ports:
            - containerPort: 6767
          volumeMounts:
          - name: bazarr-movies-nfs
            mountPath:  /movies
          - name: bazarr-tv-nfs
            mountPath:  /tv
          - name: bazarr-config
            mountPath:  /config
          - name: bazarr-backup
            mountPath:  /config/backup
          env:
          - name: PUID
            value:  "1000"
          - name: PGID
            value:  "1000"
          - name: TZ
            value:  America/New_York
        - name: subgen
          image: mccloud/subgen:latest@sha256:2841515a3b409677669f0a10d77d49160bffb8111db91640fb33a4db06b3396c
          resources:
            limits:
              cpu: 8
              memory: 6Gi
              nvidia.com/gpu: 1
            requests:
              cpu: 100m
              memory: 100Mi
          ports:
            - containerPort: 9000
          volumeMounts:
          - name: subgen-models
            mountPath:  /subgen/models
          - name: bazarr-movies-nfs
            mountPath:  /movies
          - name: bazarr-tv-nfs
            mountPath:  /tv
          env:
          - name: TRANSCRIBE_DEVICE
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  TRANSCRIBE_DEVICE
          - name: WHISPER_MODEL
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  WHISPER_MODEL
          - name: CONCURRENT_TRANSCRIPTIONS
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  CONCURRENT_TRANSCRIPTIONS
          - name: WHISPER_THREADS
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  WHISPER_THREADS
          - name: COMPUTE_TYPE
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  COMPUTE_TYPE
          - name: CLEAR_VRAM_ON_COMPLETE
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  CLEAR_VRAM_ON_COMPLETE
          - name: MODEL_CLEANUP_DELAY
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  MODEL_CLEANUP_DELAY
          - name: ASR_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: subgen-env
                key:  ASR_TIMEOUT
      volumes:
        - name: bazarr-movies-nfs
          hostPath:
            path: /mnt/mobius/Video/Movies
            type: Directory
        - name: bazarr-tv-nfs
          hostPath:
            path: /mnt/mobius/Video/TV-shows
            type: Directory
        - name: bazarr-config
          persistentVolumeClaim:
            claimName:  bazarr-config-pvc
        - name: bazarr-backup
          persistentVolumeClaim:
            claimName:  bazarr-nfs-bkup-pvc
        # - name: whisper-config
        #   persistentVolumeClaim:
        #     claimName:  whisper-config-data
        - name: subgen-models
          persistentVolumeClaim:
            claimName:  subgen-model-data
            