---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace:  media
  labels:
    app: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        app: jellyfin
    spec:
      restartPolicy: Always
      # runtimeClassName: nvidia
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
      # initContainers:
      # # remove the default config, so i can attach the desired one later
      # - name: init-qbittorrent-qbt-config
      #   image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      #   command: ["sh", "-c", "rm /config/database.xml"]
      #   volumeMounts:
      #   - name: jf-config
      #     mountPath:  /config
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest
          resources:
            limits:
              cpu: 12
              memory: 6Gi
              # nvidia.com/gpu: 1
            requests:
              cpu: 1
              memory: 512Mi
          ports:
            - containerPort: 8096
          volumeMounts:
          - name: jf-movies
            mountPath:  /Movies
          - name: jf-shows
            mountPath:  /TV
          - name: jf-config
            mountPath:  /config
          # - name: jellyfin-db-config
          #   mountPath: /config/database.xml            
          #   subPath: database-optimistic.xml
          env:
          - name: jf-puid
            valueFrom:
              configMapKeyRef:
                name: jf-env
                key:  PUID
          - name: jf-pgid
            valueFrom:
              configMapKeyRef:
                name: jf-env
                key:  PGID
          - name: jf-tz
            valueFrom:
              configMapKeyRef:
                name: jf-env
                key:  TZ
      volumes:
      - name: jf-movies
        hostPath:
          path: /mnt/mobius/Video/Movies
      - name: jf-shows
        hostPath:
          path: /mnt/mobius/Video/TV-shows
      - name: jf-config
        persistentVolumeClaim:
          claimName:  jf-config-data
      # - name: jellyfin-db-config
      #   configMap:
      #     name: jellyfin-db-configmap
          