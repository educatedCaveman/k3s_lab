---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace:  media
  labels:
    app: lidarr
spec:
  selector:
    matchLabels:
      app: lidarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      restartPolicy: Always
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:3.1.0@sha256:2e4cdc7c8d5fa36915f446a29976ee01d3f9cc9722b8530a09121c76fbabef55
          resources:
            limits:
              cpu: 2
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 50Mi
          ports:
            - containerPort: 8686
          volumeMounts:
          - name: lidarr-music-nfs
            mountPath:  /music
          - name: lidarr-downloads-nfs
            mountPath:  /downloads
          - name: lidarr-config
            mountPath:  /config
          - name: lidarr-backup
            mountPath:  /config/Backups
          env:
          - name: PUID
            value:  "1000"
          - name: PGID
            value:  "1000"
          - name: TZ
            value:  America/New_York
      volumes:
        - name: lidarr-music-nfs
          hostPath:
            path: /mnt/mobius/Music/library
            type: Directory
        - name: lidarr-downloads-nfs
          hostPath:
            path: /mnt/mobius/temp/qbittorrent/downloads
            type: Directory
        - name: lidarr-config
          persistentVolumeClaim:
            claimName:  lidarr-config-pvc
        - name: lidarr-backup
          persistentVolumeClaim:
            claimName:  lidarr-nfs-bkup-pvc