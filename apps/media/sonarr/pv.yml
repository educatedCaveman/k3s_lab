---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-nfs-bkup-pv
  namespace:  media
spec:
  capacity:
    storage: 10Gi
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  nfs:
    path: /mnt/storage_node/Backup/sonarr
    server: 192.168.11.2
  persistentVolumeReclaimPolicy: Retain